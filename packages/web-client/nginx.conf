server {
    listen 80;
    server_name localhost;

    # -------------------------------------------------------------
    # 1. FRONTEND: React SPA Routes
    # -------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------
    # 2. BACKEND: Auth Service Proxy
    # Forward http://localhost/api/auth -> http://auth_service:4001/api/auth
    # -------------------------------------------------------------
    location /api/auth {
        proxy_pass http://auth_service:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------
    # 3. BACKEND: User Service Proxy
    # Forward http://localhost/api/users -> http://user_service:4000/api/users
    # -------------------------------------------------------------
    location /api/users {
        proxy_pass http://user_service:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------
    # 4. BACKEND: Message Service & Socket.io Proxy
    # Forward REST & Socket.io WebSockets -> http://message_service:4002
    # -------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://message_service:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /api/messages {
        proxy_pass http://message_service:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}